# Terminal compatibility

# Говорит программам внутри tmux, что терминал поддерживает 256 цветов и tmux-специфичные возможности.
set -g default-terminal "tmux-256color"

# Включает truecolor/RGB-цвета для всех терминалов, чтобы темы vim/nvim и CLI выглядели нормально.
set -as terminal-features ',*:RGB'

# Включает расширенные клавиатурные последовательности, чтобы tmux лучше различал сложные сочетания клавиш.
set -g extended-keys always

# Использует формат CSI-u для расширенных клавиш; это важно для современных терминалов вроде Ghostty.
set -g extended-keys-format csi-u

# Явно сообщает tmux, что Ghostty умеет extended keys.
set -as terminal-features ',xterm-ghostty:extkeys'

# Shell

# Запускает новые окна и панели tmux с zsh вместо системного shell по умолчанию.
set -g default-shell /bin/zsh

# Prefix

# Перезагружает ~/.tmux.conf по Ctrl-b r и показывает сообщение об успешной загрузке.
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Basic behavior

# Включает мышь: выбор панелей, изменение размеров, скролл и выделение работают мышью.
set -g mouse on

# Хранит до 50000 строк истории в каждой панели, чтобы можно было далеко скроллить назад.
set -g history-limit 50000

# Уменьшает задержку распознавания Escape-последовательностей; полезно для vim/nvim.
set -g escape-time 10

# Передаёт приложениям события фокуса, чтобы редакторы понимали, когда окно стало активным.
set -g focus-events on

# Автоматически перенумеровывает окна после закрытия, чтобы не оставались дырки в номерах.
set -g renumber-windows on

# Начинает нумерацию окон с 1, а не с 0.
set -g base-index 1

# Начинает нумерацию панелей с 1, а не с 0.
setw -g pane-base-index 1

# Разрешает tmux интегрироваться с системным clipboard через возможности терминала.
set -g set-clipboard on

# Mouse wheel

# В full-screen приложениях вроде vim колесо мыши отдаётся приложению, иначе включает copy-mode и скроллит историю.
bind -T root WheelUpPane if-shell -F -t = "#{alternate_on}" "send-keys -M" "select-pane -t =; copy-mode -e; send-keys -M"

# В full-screen приложениях колесо вниз отдаётся приложению, иначе скроллит историю панели вниз.
bind -T root WheelDownPane if-shell -F -t = "#{alternate_on}" "send-keys -M" "select-pane -t =; send-keys -M"

# Windows and panes

# Создаёт новое окно в той же директории, где находится текущая активная панель.
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation and resizing

# Переключается на панель слева по Ctrl-t h.
bind h select-pane -L

# Переключается на панель снизу по Ctrl-t j.
bind j select-pane -D

# Переключается на панель сверху по Ctrl-t k.
bind k select-pane -U

# Переключается на панель справа по Ctrl-t l.
bind l select-pane -R

# Уменьшает активную панель влево на 5 колонок; -r позволяет удерживать клавишу.
bind -r H resize-pane -L 5

# Увеличивает активную панель вниз на 5 строк; -r позволяет удерживать клавишу.
bind -r J resize-pane -D 5

# Уменьшает активную панель вверх на 5 строк; -r позволяет удерживать клавишу.
bind -r K resize-pane -U 5

# Увеличивает активную панель вправо на 5 колонок; -r позволяет удерживать клавишу.
bind -r L resize-pane -R 5

# Status line

# Включает нижнюю status line tmux.
set -g status on

# Обновляет status line раз в 5 секунд.
set -g status-interval 5

# Размещает status line снизу экрана.
set -g status-position bottom

# Ограничивает левую часть status line 40 символами.
set -g status-left-length 40

# Ограничивает правую часть status line 120 символами.
set -g status-right-length 120

# Задаёт базовые цвета status line: тёмный фон и светлый текст.
set -g status-style "bg=colour236,fg=colour248"

# Показывает слева имя tmux-сессии.
set -g status-left "#[bold,fg=colour81] #S #[default]"

# Показывает справа пользователя, host, дату и время.
set -g status-right "#[fg=colour244]#(whoami)@#H #[fg=colour81]%Y-%m-%d %H:%M "

# Форматирует обычные вкладки окон как номер и имя окна.
setw -g window-status-format " #I:#W "

# Форматирует активную вкладку окна как номер, имя и звёздочку.
setw -g window-status-current-format " #I:#W* "

# Выделяет активную вкладку жирным текстом, синим фоном и белым текстом.
setw -g window-status-current-style "bold,bg=colour31,fg=colour15"

# Делает рамки неактивных панелей тёмно-серыми.
set -g pane-border-style "fg=colour238"

# Делает рамку активной панели голубой.
set -g pane-active-border-style "fg=colour81"

# Задаёт цвета всплывающих сообщений tmux, например после reload.
set -g message-style "bg=colour31,fg=colour15"
